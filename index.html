    <!-- Critical Inline Loader CSS for instantaneous first paint -->
    <style id="loader-critical-css">
      body.loading-lock {
        overflow: hidden !important;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 999999;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: auto;
      }
      .skip-loader #app-loader {
        display: none !important;
      }
      .loader-video-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1);
        will-change: transform;
      }
      .loader-radial-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at center, rgba(255, 0, 0, 0.5) 0%, rgba(255, 0, 0, 0.12) 40%, transparent 72%);
        opacity: 0;
        transform: scale(0.65);
        will-change: opacity, transform;
      }
      .loader-progress-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background-color: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        z-index: 10;
      }
      .loader-progress-bar {
        width: 100%;
        height: 100%;
        background-color: #ff0000;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 0 12px rgba(255, 0, 0, 0.85), 0 0 24px rgba(255, 0, 0, 0.45);
      }
      /* Step 1 (0 to 0.4s): loader video scales (1 to 1.08) & expanding radial glow */
      #app-loader.loader-step-1 .loader-video {
        transform: scale(1.08);
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      }
      #app-loader.loader-step-1 .loader-radial-glow {
        opacity: 1;
        transform: scale(1.15);
        transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      }
      /* Step 2 (0.4 to 1.2s): crossfade out (opacity 1 to 0) */
      #app-loader.loader-step-2 {
        opacity: 0;
        transition: opacity 0.8s cubic-bezier(0.76, 0, 0.24, 1);
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader.loader-step-1 .loader-video,
        #app-loader.loader-step-1 .loader-radial-glow {
          transform: none !important;
          transition: none !important;
          opacity: 0 !important;
        }
        #app-loader.loader-step-2 {
          opacity: 0 !important;
          transition: opacity 0.3s ease !important;
        }
      }
    </style>

    <script>

    <!-- Full-Screen Video Loader Overlay -->

          src="/assets/loader.mp4"

          loop
          playsinline
          preload="auto"
        ></video>
        <div class="loader-radial-glow" aria-hidden="true"></div>

        <div id="loader-progress-bar" class="loader-progress-bar"></div>
      </div>
    </div>

    <!-- Inline Loader Logic & Preloader Pipeline -->
    <script>
      (function() {
        var isSkipped = document.documentElement.classList.contains('skip-loader');
        if (isSkipped) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runRepeatEntrance);
          } else {
            runRepeatEntrance();
          }
          function runRepeatEntrance() {
            document.body.classList.add('hero-enter');
            setTimeout(function() {
              document.body.classList.add('hero-ready');
            }, 1200);
          }
          return;
        }

        var loader = document.getElementById('app-loader');
        var video = document.getElementById('loader-video');
        var progressBar = document.getElementById('loader-progress-bar');
        var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReduced && video) {
          video.pause();
          video.currentTime = 0;
        }

        // Hero clip assets to preload in background
        var clips = [
          '/clips/gt_final.mp4',
          '/clips/butterfly.mp4',
          '/clips/chintamani.mp4',
          '/clips/eye.mp4',
          '/portfolio.mp4',
          '/clips/south_melody.mp4',
          '/clips/color_grade.mp4',
          '/clips/mor.mp4',
          '/clips/ready_or_not.mp4'
        ];

        var totalItems = clips.length + 1; // clips + window load
        var loadedItems = 0;
        var assetsReady = false;
        var startTime = performance.now();
        var MIN_DISPLAY_MS = 2000;
        var MAX_DISPLAY_MS = 8000;
        var exitStarted = false;

        function setProgress(ratio) {
          if (progressBar) {
            progressBar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, ratio)) + ')';
          }
        }

        function itemLoaded() {
          loadedItems++;
          setProgress(loadedItems / totalItems);
          if (loadedItems >= totalItems) {
            assetsReady = true;
            checkReadyToExit();
          }
        }

        if (document.readyState === 'complete') {
          itemLoaded();
        } else {
          window.addEventListener('load', itemLoaded, { once: true });
        }

        clips.forEach(function(src) {
          var v = document.createElement('video');
          v.preload = 'auto';
          v.muted = true;
          var onDone = function() {
            v.removeEventListener('canplaythrough', onDone);
            v.removeEventListener('loadeddata', onDone);
            v.removeEventListener('error', onDone);
            itemLoaded();
          };
          v.addEventListener('canplaythrough', onDone, { once: true });
          v.addEventListener('loadeddata', onDone, { once: true });
          v.addEventListener('error', onDone, { once: true });
          v.src = src;
          v.load();
        });

        var maxTimer = setTimeout(function() {
          assetsReady = true;
          triggerExitSequence();
        }, MAX_DISPLAY_MS);

        function checkReadyToExit() {
          if (exitStarted) return;
          var elapsed = performance.now() - startTime;
          if (elapsed < MIN_DISPLAY_MS) {
            setTimeout(checkReadyToExit, MIN_DISPLAY_MS - elapsed);
            return;
          }
          waitForBeat(function() {
            triggerExitSequence();
          });
        }

        function waitForBeat(callback) {
          if (!video || prefersReduced || !video.duration || video.paused) {
            callback();
            return;
          }
          var cur = video.currentTime;
          var dur = video.duration || 8;
          var targetBeat = Math.ceil((cur + 0.04) / 0.5) * 0.5;
          if (targetBeat >= dur) targetBeat = dur;

          var called = false;
          var done = function() {
            if (called) return;
            called = true;
            clearTimeout(fallback);
            callback();
          };

          // Hard fallback: never wait more than 550ms for a 0.5s beat
          var fallback = setTimeout(done, 550);

          function step() {
            if (called || exitStarted) return;
            var now = video.currentTime;
            if (now >= targetBeat || now < cur || video.paused) {
              done();
            } else {
              requestAnimationFrame(step);
            }
          }
          requestAnimationFrame(step);
        }

        function triggerExitSequence() {
          if (exitStarted) return;
          exitStarted = true;
          clearTimeout(maxTimer);
          setProgress(1);

          if (prefersReduced) {
            if (loader) loader.classList.add('loader-step-2');
            document.body.classList.add('hero-enter');
            document.body.classList.remove('is-loading');
            setTimeout(cleanup, 350);
            return;
          }

          // Step 1 (0 to 0.4s): loader video scales (1 to 1.08) while red radial glow expands
          if (loader) loader.classList.add('loader-step-1');

          // Step 2 (0.4 to 1.2s): overlay crossfades out (opacity 1 to 0)
          setTimeout(function() {
            if (loader) loader.classList.add('loader-step-2');
          }, 400);

          // Step 3 (at ~0.7s, overlapping with Step 2): hero animates in
          setTimeout(function() {
            document.body.classList.add('hero-enter');
            setTimeout(function() {
              document.body.classList.remove('is-loading');
              window.dispatchEvent(new CustomEvent('loader:hero-start'));
            }, 500); // 700 + 500 = 1200ms
          }, 700);

          // Cleanup after 1.3s
          setTimeout(cleanup, 1300);
        }

        function cleanup() {
          try {
            sessionStorage.setItem('portfolio_visited', 'true');
          } catch (e) {}
          document.body.classList.remove('loading-lock');
          document.body.classList.add('hero-ready');
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }
      })();
    </script>
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
