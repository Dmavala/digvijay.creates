<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>404 — Frame Not Found | Digvijay Rishikesh Kohinkar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .code {
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: clamp(4rem, 15vw, 10rem);
        font-weight: 900;
        color: #ff0000;
        line-height: 1;
        letter-spacing: -0.05em;
        text-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
      }
      .tag {
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 0.85rem;
        letter-spacing: 0.25em;
        color: #a3a3a3;
        text-transform: uppercase;
        margin-top: 12px;
      }
      .message {
        font-size: 1.15rem;
        color: #737373;
        max-width: 440px;
        margin: 20px 0 36px;
        line-height: 1.6;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 28px;
        background-color: #ff0000;
        color: #ffffff;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      .btn:hover {
        background-color: #cc0000;
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      }
      .btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1 class="tag">FRAME MISSING // SEQUENCE OUT OF BOUNDS</h1>
      <p class="message">The clip or coordinate you're looking for does not exist on this timeline.</p>
      <a href="/" class="btn">Return to Timeline</a>
    </main>
  </body>
</html>
